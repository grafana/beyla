name: Set up mise
description: Set up mise and install only the selected tools.
outputs:
  download-cache-hit:
    description: Whether the shared verified mise download cache was restored exactly.
    value: ${{ steps.restore-downloads.outputs.cache-hit }}
  download-cache-key:
    description: Exact key for the shared verified mise download cache.
    value: ${{ steps.restore-downloads.outputs.cache-primary-key }}
  download-cache-path:
    description: Platform-specific path to mise's verified download cache.
    value: ${{ steps.download-cache-path.outputs.path }}
inputs:
  profile:
    description: Named exact set of Mise tools to enable for this job.
    required: true
  cache-downloads:
    description: Whether to restore the shared verified mise download cache.
    required: false
    default: "true"
  cache-modules:
    description: Whether to cache the Go module download directory.
    required: false
    default: "false"
  cache-build:
    description: Whether to cache the Go build directory.
    required: false
    default: "false"
  cache-build-prefix:
    description: Prefix separating Go build-cache trust and workload scopes.
    required: false
    default: "go-build"
runs:
  using: composite
  steps:
    - name: Resolve Mise tool profile
      shell: bash
      env:
        MISE_TOOLS_PROFILE: ${{ inputs.profile }}
      run: bash "$GITHUB_ACTION_PATH/resolve-profile.sh"

    - name: Resolve mise download cache path
      id: download-cache-path
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          echo 'path=~/Library/Caches/mise/downloads-cas' >> "$GITHUB_OUTPUT"
        else
          echo 'path=~/.cache/mise/downloads-cas' >> "$GITHUB_OUTPUT"
        fi

    - name: Restore shared verified mise downloads
      id: restore-downloads
      if: ${{ inputs.cache-downloads == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # mise verifies downloads against mise.lock checksums
      with:
        path: ${{ steps.download-cache-path.outputs.path }}
        key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', '.github/actions/setup-mise/action.yml', '.github/actions/setup-mise/measure-download-cache.sh', '.github/workflows/mise-download-cache.yml') }}-union

    - name: Cache Go modules
      if: ${{ inputs.cache-modules == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] go.sum verifies module integrity
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', '**/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache Go build
      if: ${{ inputs.cache-build == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] Go build cache is content-addressable and self-verifying
      with:
        path: ~/.cache/go-build
        key: ${{ inputs.cache-build-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.go', 'go.sum') }}
        restore-keys: |
          ${{ inputs.cache-build-prefix }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Set up mise CLI
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      with:
        version: "2026.10.18"
        cache: false
        install: true

    - name: Check Go version matches go.mod
      shell: bash
      env:
        MISE_ENABLE_TOOLS: go
      run: mise run --skip-tools check:go-version
