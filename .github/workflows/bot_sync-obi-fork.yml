name: Sync OBI fork
run-name: OBI fork sync target ${{ inputs.obi_sha || 'latest' }} request ${{ inputs.request_run_id || 'manual' }}

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      obi_sha:
        description: Exact OBI target from the daily Beyla adoption request (empty samples upstream main)
        required: false
        type: string
      request_run_id:
        description: Originating trusted daily adoption workflow run ID
        required: false
        type: string

permissions: {}

jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    name: Inspect exact OBI source and fork PR state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.inspect.outputs.action }}
      reason: ${{ steps.inspect.outputs.reason }}
      target_sha: ${{ steps.inspect.outputs.target_sha }}
      fork_main_sha: ${{ steps.inspect.outputs.fork_main_sha }}
      branch: ${{ steps.inspect.outputs.branch }}
      pr_number: ${{ steps.inspect.outputs.pr_number }}
    steps:
      - name: Check out trusted main workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Read-only source and PR reconciliation
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          OBI_SHA: ${{ inputs.obi_sha }}
        run: python3 scripts/release-reconciliation/adoption/obi_fork_sync.py inspect

  publish-fork-pr:
    needs: inspect
    if: needs.inspect.outputs.action == 'create' && vars.OBI_FORK_SYNC_WRITER_ENABLED == 'true'
    concurrency:
      group: obi-adoption-writer
      cancel-in-progress: false
    name: Create exact-SHA fork PR (never update main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Check out trusted main workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Get GitHub App token
        id: github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: grafana-beyla-bot
          permission_set: default
      - name: Revalidate and create-only exact-SHA draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.github-app-token.outputs.token }}
          OBI_SHA: ${{ needs.inspect.outputs.target_sha }}
          EXPECTED_FORK_BASE: ${{ needs.inspect.outputs.fork_main_sha }}
          REQUEST_RUN_ID: ${{ inputs.request_run_id }}
          OBI_FORK_SYNC_WRITER_ENABLED: ${{ vars.OBI_FORK_SYNC_WRITER_ENABLED }}
        run: python3 scripts/release-reconciliation/adoption/obi_fork_sync.py publish

  fork-pr-continuation:
    if: github.ref == 'refs/heads/main' && vars.OBI_ADOPTION_WRITER_ENABLED == 'true'
    concurrency:
      group: obi-adoption-writer
      cancel-in-progress: false
    name: Continue exact daily target after approved fork merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Check out trusted main workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
      - name: Get GitHub App token
        id: github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@46f48da11e78ebdba7a8747ae456b11062fac83e # create-github-app-token/v0.3.1
        with:
          github_app: grafana-beyla-bot
          permission_set: default
      - name: Reserve and dispatch one exact-SHA adoption continuation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: python3 scripts/release-reconciliation/adoption/obi_fork_sync.py continue

  writer-disabled-report:
    needs: inspect
    if: needs.inspect.outputs.action == 'create' && vars.OBI_FORK_SYNC_WRITER_ENABLED != 'true'
    name: Report fork PR without writes
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explain disabled fork writer
        env:
          TARGET_SHA: ${{ needs.inspect.outputs.target_sha }}
          REASON: ${{ needs.inspect.outputs.reason }}
        run: |
          printf '# OBI fork PR writer disabled\n\nExact target %s is eligible, but no fork ref or PR was written because OBI_FORK_SYNC_WRITER_ENABLED is not true.\n\n%s\n' \
            "$TARGET_SHA" "$REASON" >>"$GITHUB_STEP_SUMMARY"
