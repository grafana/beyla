name: Devcontainer smoke test

on:
  pull_request:
    branches: ["main", "release-*"]

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/_required-check-scope.yml
    permissions:
      contents: read
    with:
      paths: |
        .devcontainer/**
        Dockerfile
        mise.toml
        mise.lock
        .mise/**
        internal/java/mise.toml
        internal/java/mise.lock
        internal/java/.mise/**
        internal/test/oats/mise.toml
        internal/test/oats/.mise/**
        .github/actions/setup-mise/**
        .github/workflows/devcontainer-smoke.yml

  smoke:
    name: Build and run mise in devcontainer
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build devcontainer image
        run: docker build --file .devcontainer/Dockerfile --tag beyla-devcontainer-smoke:ci .devcontainer

      - name: Verify mise and run a repository task
        env:
          MISE_TRUSTED_CONFIG_PATHS: /workspace
          MISE_ENABLE_TOOLS: none
          TEST_OUTPUT: /tmp/beyla-devcontainer-smoke
        run: |
          set -euo pipefail
          expected_version="$(sed -n 's/^[[:space:]]*version: "\([^"]*\)".*/\1/p' .github/actions/setup-mise/action.yml | head -n 1)"
          build_image_version="$(sed -n 's|.*ghcr.io/jdx/mise:\([^@]*\)@.*|\1|p' Dockerfile | head -n 1)"
          test -n "${expected_version}"
          test "${build_image_version}" = "${expected_version}"

          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            --workdir /workspace \
            --env "EXPECTED_MISE_VERSION=${expected_version}" \
            --env MISE_TRUSTED_CONFIG_PATHS \
            --env MISE_ENABLE_TOOLS \
            --env TEST_OUTPUT \
            --entrypoint /bin/bash \
            beyla-devcontainer-smoke:ci \
            -euo pipefail -c '
              mise_output="$(mise --version)"
              printf "%s\n" "${mise_output}"
              actual_version="${mise_output%% *}"
              test "${actual_version}" = "${EXPECTED_MISE_VERSION}"

              mise run --skip-tools test:prepare-output
              test -d "${TEST_OUTPUT}/run"
            '

  required-check:
    name: Beyla devcontainer CI
    if: always()
    needs: [scope, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Report required-check result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.applicable }}
          TEST_RESULT: ${{ needs.smoke.result }}
        run: |
          if [[ "${SCOPE_RESULT}" == success && ( ( "${APPLICABLE}" == false && "${TEST_RESULT}" == skipped ) || ( "${APPLICABLE}" == true && "${TEST_RESULT}" == success ) ) ]]; then
            exit 0
          fi
          echo "Unexpected required-check results: scope=${SCOPE_RESULT}, applicable=${APPLICABLE}, smoke=${TEST_RESULT}" >&2
          exit 1
