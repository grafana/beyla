name: Pull request checks

on:
  push:
    branches: ["main", "release-*"]
  pull_request:
    branches: ["main", "release-*"]

concurrency:
  group: pull-request-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Set restrictive permissions at workflow level
permissions:
  contents: read

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Test Make compatibility
        run: bash scripts/tests/make-compat.sh

      - name: Test mise task contracts
        run: bash scripts/tests/mise-task-contracts.sh

      - name: Test mise action tool profiles
        run: bash .github/actions/setup-mise/test.sh

      - name: Set up mise
        uses: ./.github/actions/setup-mise
        with:
          cache-build: "true"
          cache-build-prefix: "go-build-pr-race"
          profile: generate
          cache-modules: "true"

      - name: Test canonical mise task names and compatibility aliases
        run: bash scripts/tests/mise-task-naming.sh

      - name: Verify cold bpf2go install and ARM64 generation
        run: bash scripts/tests/mise-bpf2go-cross-target.sh

      - name: Generate and vendor OBI
        run: mise run vendor:obi

      - name: Check config schema is up to date
        run: mise run check:config-schema

      - name: Build unit test matrix
        id: build-matrix
        env:
          PARTITIONS: 3
        run: |
          mise run test:prepare-output
          echo -n "matrix=" >> $GITHUB_OUTPUT
          mise run test:matrix >> $GITHUB_OUTPUT

      - name: Upload generated build inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # prevent cache poisoning by using the SHA of the commit
          name: bpf-generated-${{ github.sha }}
          path: |
            **/*_bpfel.go
            **/*_bpfel.o
            vendor/go.opentelemetry.io/obi/pkg/internal/java/embedded/obi-java-agent.jar
          retention-days: 1

  lint:
    name: Lint
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up mise
        uses: ./.github/actions/setup-mise
        with:
          cache-build: "true"
          cache-build-prefix: "go-build-pr-race"
          profile: lint
          cache-modules: "true"

      - name: Download generated build inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpf-generated-${{ github.sha }}

      - name: Lint
        run: mise run lint:go

  lint-dashboard:
    name: Lint dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint dashboards
        uses: grafana/dashboard-linter@c7d457aca03b773a9353be7e9d53d920b10f646c # v0.5.2
        with:
          files: ops/beyla-mixin/dashboards
          args: --strict

  unit-test:
    name: "Unit test ${{ matrix.description }}"
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Grant specific permissions needed only for this job
    permissions:
      contents: read
      pull-requests: write
      # required for CODECOV token
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up mise
        uses: ./.github/actions/setup-mise
        with:
          cache-build: "true"
          cache-build-prefix: "go-build-pr-race"
          profile: unit
          cache-modules: "true"

      - name: Download generated build inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bpf-generated-${{ github.sha }}

      - name: Run unit tests
        env:
          MATRIX_ID: ${{ matrix.id }}
          MATRIX_PACKAGES: ${{ matrix.packages }}
        run: mise run test:shard --shard-id "${MATRIX_ID}" --packages "${MATRIX_PACKAGES}"

      - name: Exclude generated files from coverage
        env:
          SHARD_ID: ${{ matrix.id }}
        run: mise run coverage:exclude-generated-shard --shard-id "${SHARD_ID}"

      - id: get-codecov-token
        uses: grafana/shared-workflows/actions/get-vault-secrets@9f37f656e063f0ad0b0bfc38d49894b57d363936 # get-vault-secrets/v1.2.1
        continue-on-error: true
        with:
          # Secrets placed in the ci/repo/grafana/beyla/codecov path in Vault
          repo_secrets: |
            CODECOV_TOKEN=codecov:token

      - name: Report coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          files: ./testoutput/cover-shard-${{ matrix.id }}.txt
          flags: unittests
          name: go-unittests-coverage-shard-${{ matrix.id }}-${{ github.run_number }}
