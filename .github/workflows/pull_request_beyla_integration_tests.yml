name: Pull request Beyla integration tests

on:
  push:
    branches: ["main", "release-*"]
  pull_request:
    branches: ["main", "release-*"]

concurrency:
  group: beyla-integration-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Set restrictive permissions at workflow level
permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/_required-check-scope.yml
    with:
      paths: |
        **.go
        go.mod
        go.sum
        bpf/**
        internal/**
        pkg/**
        cmd/**
        vendor/**
        Makefile
        scripts/generate-integration-matrix.sh
        .github/workflows/pull_request_beyla_integration_tests.yml
        .obi-src
        .obi-src/**
    permissions:
      contents: read

  test-matrix:
    needs: scope
    if: needs.scope.outputs.applicable == 'true'
    name: "Build Beyla integration matrix"
    runs-on: ubuntu-x64
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: ./.github/actions/setup-mise
        with:
          profile: go

      - name: Build matrix
        id: build-matrix
        env:
          PARTITIONS: 1
          TEST_TAGS: integration
        run: |
          echo -n "matrix=" >> "$GITHUB_OUTPUT"
          mise run integration:matrix:beyla >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.description }}
    needs: test-matrix
    runs-on: ubuntu-x64
    env:
      DOCKER_BUILDKIT: "1"
    # Grant specific permissions needed only for this job
    permissions:
      contents: read
      pull-requests: write
      # required for CODECOV token, Dockerhub access
      id-token: write
      checks: write
      # Required for uploading artifacts
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test-matrix.outputs.matrix) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Login to DockerHub
        if: github.repository == 'grafana/beyla' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: grafana/shared-workflows/actions/dockerhub-login@3e6b757dee9d45b7c1b16d7f53b8cab2c9532ccb # dockerhub-login/v3.0.0

      - name: Set up mise
        uses: ./.github/actions/setup-mise
        with:
          profile: integration
      - name: Generate files
        run: "mise run test:prepare-output ::: vendor:obi"

      - name: Verify Beyla compiles
        run: docker build -f internal/test/integration/components/beyla/Dockerfile .

      - name: Run Beyla integration tests
        env:
          # zizmor template-injection fixes: pass data as env vars
          MATRIX_ID: ${{ matrix.id }}
          MATRIX_JSON: ${{ toJson(matrix) }}
          MATRIX_TEST_PATTERN: ${{ matrix.test_pattern }}
          RUN_NUMBER: ${{ github.run_number }}
          TEST_TAGS: integration
        run: |
          echo Partition
          echo "${MATRIX_JSON}"

          if [ -z "${MATRIX_TEST_PATTERN}" ]; then
            echo "Error: Test pattern is empty for shard ${MATRIX_ID}"
            exit 1
          fi

          mkdir -p reports

          gotestsum \
              --rerun-fails=2 --rerun-fails-max-failures=2 --rerun-fails-abort-on-data-race \
              --packages="./internal/test/integration" -ftestname \
              --jsonfile=reports/test-run-"${RUN_NUMBER}"-"${MATRIX_ID}".log \
              -- -race -tags="${TEST_TAGS}" -timeout 30m \
              -mod vendor \
              -run="^(${MATRIX_TEST_PATTERN})$" ./internal/test/integration

      - name: Process coverage data
        run: mise run integration:coverage-data

      - name: Report coverage
        uses: ./.github/actions/report-codecov
        with:
          files: ./testoutput/itest-covdata.txt
          flags: beyla-integration-test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beyla-test-reports-${{ github.run_number }}-${{ matrix.id }}
          path: reports/*.log
          retention-days: 5

      - name: Upload test logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: beyla-test-logs-${{ github.run_number }}-${{ matrix.id }}
          path: |
            testoutput/*.log
            testoutput/kind
  required-check:
    name: Beyla integration CI
    if: always()
    needs: [scope, test-matrix, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Verify required integration suite result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.applicable }}
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$SCOPE_RESULT" = success ] && [ "$APPLICABLE" = false ] \
            && [ "$MATRIX_RESULT" = skipped ] && [ "$TEST_RESULT" = skipped ]; then
            echo "Beyla integration tests not applicable; suite jobs were skipped."
            exit 0
          fi
          if [ "$SCOPE_RESULT" = success ] && [ "$APPLICABLE" = true ] \
            && [ "$MATRIX_RESULT" = success ] && [ "$TEST_RESULT" = success ]; then
            echo "Beyla integration tests completed successfully."
            exit 0
          fi
          echo "Beyla integration tests required check failed or produced an unexpected state: scope=$SCOPE_RESULT applicable=$APPLICABLE matrix=$MATRIX_RESULT tests=$TEST_RESULT"
          exit 1
