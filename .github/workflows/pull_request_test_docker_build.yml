name: Test Docker build
on:
  pull_request:
    branches: ["main", "release-*"]

concurrency:
  group: docker-build-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # required for DockerHub access
      id-token: write

    strategy:
      matrix:
        include:
          - file: Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - file: Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - file: k8scache.Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - file: k8scache.Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Login to DockerHub
        if: github.repository == 'grafana/beyla' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: grafana/shared-workflows/actions/dockerhub-login@e5b7989c92b55fe3ac6dd006d6de49082ba8c507

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.file }}
          push: false
          platforms: ${{ matrix.platform }}
