name: Verify native build platforms

on:
  push:
    branches:
      - gregor/verify-native-build-platforms

permissions:
  contents: read

jobs:
  native-build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GNU make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $existing = Get-Command make -ErrorAction SilentlyContinue
          if (-not $existing) {
            choco install make --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey failed to install GNU make (exit $LASTEXITCODE)."
            }
            $env:PATH = "$env:PATH;C:\ProgramData\chocolatey\bin"
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v make >/dev/null 2>&1; then
            echo "GNU make is missing from the runner bootstrap; no build attempted." >&2
            exit 1
          fi
          make --version | head -n 1

      - name: Set up pinned Mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: "2026.11.11"
          cache: false
          install: false

      - name: Install repository toolchains
        shell: bash
        run: mise install

      - name: Verify and compile Beyla
        shell: bash
        run: mise run build
