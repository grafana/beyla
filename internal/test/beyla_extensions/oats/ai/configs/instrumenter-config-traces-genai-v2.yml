# Beyla v1 equivalent of the upstream Cohere fixture, retaining its filename.
log_level: debug
service_namespace: integration-test
otel_traces_export:
  endpoint: http://collector:4318
  protocol: http/protobuf
  batch_timeout: 1ms
  instrumentations: [http, genai]
otel_metrics_export:
  endpoint: http://collector:4318
  protocol: http/protobuf
  interval: 1s
metrics:
  features: [application]
discovery:
  instrument:
    - open_ports: 8080
ebpf:
  batch_timeout: 10ms
  buffer_sizes:
    http: 65536
  payload_extraction:
    http:
      genai:
        cohere:
          enabled: true
routes:
  unmatched: path
attributes:
  select:
    traces:
      include:
        - gen_ai.input.messages
        - gen_ai.system_instructions
        - gen_ai.output.messages
        - gen_ai.metadata
        - gen_ai.tool.definitions
        - error.type
trace_printer: text
