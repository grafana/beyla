[tasks.prereq]
description = "Prepare generated OBI/vendor dependencies and OATS test output"
depends = ["//:vendor:obi"]
dir = "{{config_root}}/../../../"
run = 'mkdir -p "${TEST_OUTPUT}/run"'

[tasks."matrix:integration-test-json"]
description = "Generate the OATS integration test matrix JSON"
dir = "{{config_root}}/../../../"
run = 'scripts/generate-dir-matrix.sh internal/testgenerated/oats /harness/'

[tasks.test]
description = "Run all OATS suites and merge integration coverage"
depends = [":prereq"]
run = [
  { task = ":test:sql" },
  { task = ":test:mongo" },
  { task = ":test:redis" },
  { task = ":test:kafka" },
  { task = ":test:http" },
  { task = ":test:memcached" },
  { task = ":test:ai" },
  { task = ":test:nats" },
  { task = ":test:amqp" },
  { task = "//:integration:coverage-data" },
]

[tasks."test:debug"]
description = "Run OATS Kafka tests in manual debug mode"
depends = [":prereq"]
dir = "{{config_root}}/../../../internal/testgenerated/oats/kafka"
env = { TESTCASE_BASE_PATH = "./yaml", TESTCASE_MANUAL_DEBUG = "true", TESTCASE_TIMEOUT = "1h" }
run = '"${OATS_GINKGO:-${GINKGO:-ginkgo}}" -v -r'

[tasks."test:harness"]
description = "Run OATS harness unit tests"
depends = ["//:generate:obi-tests"]
dir = "{{config_root}}/../../../internal/testgenerated/oats/harness"
run = "go test -race ./..."

[tasks."test:ai"]
description = "Run OATS ai tests"
depends = [":prereq"]
dir = "{{config_root}}/../../../internal/testgenerated/oats/ai"
env = { TESTCASE_BASE_PATH = "./yaml", TESTCASE_TIMEOUT = "5m" }
run = 'mkdir -p "${TEST_OUTPUT}/run" && "${OATS_GINKGO:-${GINKGO:-ginkgo}}" -v -r'

