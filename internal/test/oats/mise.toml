[env]
TESTCASE_BASE_PATH = "./yaml"
TESTCASE_TIMEOUT = "5m"

[tasks.prepare]
alias = ["prereq", "//oats:prereq", "oats-prereq", "oats:prereq"]
description = "Prepare generated OBI/vendor dependencies and OATS test output"
depends = ["//:vendor:obi"]
dir = "{{config_root}}/../../../"
run = 'mkdir -p "${TEST_OUTPUT}/run"'

[tasks.matrix]
alias = ["matrix:integration-test-json", "//oats:matrix:integration-test-json", "oats-integration-test-matrix-json", "oats:matrix:integration-test-json"]
description = "Generate the OATS integration test matrix JSON"
dir = "{{config_root}}/../../../"
run = 'scripts/generate-dir-matrix.sh internal/testgenerated/oats /harness/'

[tasks.test]
alias = ["oats-test", "oats:test"]
description = "Run all OATS suites and merge integration coverage"
depends = [":prepare"]
run = [
  { task = ":test:sql" },
  { task = ":test:mongo" },
  { task = ":test:redis" },
  { task = ":test:kafka" },
  { task = ":test:http" },
  { task = ":test:memcached" },
  { task = ":test:ai" },
  { task = ":test:nats" },
  { task = ":test:amqp" },
  { task = "//:integration:coverage-data" },
]

[tasks.debug]
alias = ["test:debug", "//oats:test:debug", "oats-test-debug", "oats:test:debug"]
description = "Run an OATS suite in manual debug mode (default: kafka)"
depends = [":prepare"]

[tasks."test:harness"]
alias = ["oats-test-harness", "oats:test:harness"]
description = "Run OATS harness unit tests"
depends = ["//:generate:obi-tests"]
dir = "{{config_root}}/../../../internal/testgenerated/oats/harness"
run = "go test -race ./..."

[tasks."test:ai"]
alias = ["oats-test-ai", "oats:test:ai"]
description = "Run OATS ai tests"
depends = [":prepare"]
dir = "{{config_root}}/../../../internal/testgenerated/oats/ai"
run = 'mkdir -p "${TEST_OUTPUT}/run" && "${OATS_GINKGO:-${GINKGO:-ginkgo}}" -v -r'

