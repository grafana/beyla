# Compatibility floor for mise config features, not the selected CI/container
# runtime pin (maintained separately and intentionally can advance independently).
min_version = "2026.10.18"
monorepo_root = true

[monorepo]
lockfile = true
config_roots = ["internal/java", "internal/test/oats"]

[monorepo.path_aliases]
java = "internal/java"
oats = "internal/test/oats"

[settings]
lockfile = true

[tool_alias]
bpf2go = "go:github.com/cilium/ebpf/cmd/bpf2go"
go-licenses = "go:github.com/google/go-licenses/v2"
dashboard-linter = "github:grafana/dashboard-linter"
llvm-tools = "conda:llvm-tools"
clang-tidy = "github:cpp-linter/clang-tools-static-binaries"

[env]
# Mise defaults intentionally replace both unset and empty variables. Keep
# these Make/CI-compatible defaults in one place so scripts don't drift.
OCI_BIN = { default = "docker" }
TEST_OUTPUT = { default = "./testoutput" }
ENVTEST_K8S_VERSION = { default = "1.30.0" }
CONFIG_SCHEMA_FILE = { default = "docs/config-schema.json" }
GEN_IMG_VERSION = { default = "latest" }
TEST_TAGS = { default = "integration" }
COMPOSE_ARGS = { default = "-f internal/testgenerated/integration/docker-compose.yml" }
EXCLUDE_COVERAGE_FILES = { default = "(_bpfel.go)|(/beyla/v2/internal/test/)|(/beyla/v2/configs/)|(/v2/examples/)|(.pb.go)|(/beyla/v2/pkg/export/otel/metric/)" }

[tools]
go = { version = "1.26.10" }
golangci-lint = { version = "2.14.0" }
kind = "0.33.0"
setup-envtest = "0.25.1"
gotestsum = "1.13.0"
ginkgo = { version = "2.33.0", install_env = { GOARCH = "{{ arch(x64=\"amd64\", arm64=\"arm64\") }}", GOOS = "{{ os(macos=\"darwin\") }}" } }
"go-licenses" = { version = "2.0.1", install_env = { GOARCH = "{{ arch(x64=\"amd64\", arm64=\"arm64\") }}", GOOS = "{{ os(macos=\"darwin\") }}" } }
"bpf2go" = { version = "0.22.0", install_env = { GOARCH = "{{ arch(x64=\"amd64\", arm64=\"arm64\") }}", GOOS = "{{ os(macos=\"darwin\") }}" } }
"dashboard-linter" = { version = "0.1.1", matching = "dashboard-linter_" }
clang = { version = "22.1.8" }
"llvm-tools" = { version = "22.1.8" }
"clang-format" = { version = "22.1.8" }

[tools."clang-tidy"]
version = "2026.09.01-5fb8802d"
matching = "clang-tidy-22_"
bin = "clang-tidy"

# The root Go module is the source of truth for the Go toolchain version.
# Keep this task in CI so a version drift fails before a build starts.
[tasks."check:go-version"]
description = "Check the Mise Go version matches go.mod"
run = '''actual=$(mise current go)
root_expected=$(awk '$1 == "go" { print $2; exit }' go.mod)
if [ "$actual" != "$root_expected" ]; then
  echo "Mise Go $actual does not match root go.mod ($root_expected)" >&2
  exit 1
fi'''

[tasks.verify]
description = "Prepare, vendor dependencies, and run lint and unit tests"
run = [
  { task = "test:prepare-output" },
  { task = "check:bpf2go-version" },
  { task = "vendor:obi" },
  { tasks = [
    "lint",
    "test",
  ] },
]

[tasks.lint]
description = "Run repository linters"
depends = ["lint:go", "lint:dashboard"]

[tasks.build]
alias = ["all"]
description = "Vendor dependencies, verify, and compile Beyla"
run = [{ task = "verify" }, { task = "compile" }]

[tasks.dev]
description = "Prepare and vendor OBI, then build a coverage-enabled binary"
run = [
  { task = "test:prepare-output" },
  { task = "vendor:obi" },
  { task = "compile:for-coverage" },
]

[tasks.artifact]
description = "Build and package the Beyla binary artifact"
run = [
  { task = "vendor:obi" },
  { task = "//java:build" },
  { task = "compile" },
  "cp LICENSE NOTICE third_party_licenses.csv ./bin/",
  "tar -C ./bin -cvzf bin/beyla.tar.gz beyla LICENSE NOTICE third_party_licenses.csv",
]

[tasks."generate"]
description = "Generate OBI and Beyla eBPF bindings locally"
depends = ["submodule:obi"]
run = [
  '''obi_module="${OBI_MODULE:-$(awk '$1 == "replace" && $2 == "go.opentelemetry.io/obi" && $3 == "=>" { print $4; exit }' go.mod)}"; BPF2GO="${BPF2GO:-$(command -v bpf2go)}" CLANG="${CLANG:-$(command -v clang)}" make -C "$obi_module" generate''',
  { task = "generate:beyla" },
]

[tasks."java:build"]
alias = ["java-build"]
description = "Build the Java agent and embed it in Beyla"
depends = ["//java:build"]

[tasks."java:clean"]
alias = ["java-clean"]
description = "Clean Java agent build artifacts"
depends = ["//java:clean"]

[tasks."java:docker-build"]
alias = ["java-docker-build"]
description = "Build the Java agent with Docker"
depends = ["//java:docker-build"]

[tasks."java:spotless-apply"]
alias = ["java-spotless-apply"]
description = "Format Java code"
depends = ["//java:spotless-apply"]

[tasks."java:spotless-check"]
alias = ["java-spotless-check"]
description = "Check Java code formatting"
depends = ["//java:spotless-check"]

[tasks."java:test"]
alias = ["java-test"]
description = "Test the Java agent"
depends = ["//java:test"]

[tasks."java:verify"]
alias = ["java-verify"]
description = "Check Java formatting, run tests, and build the Java agent"
depends = ["//java:verify"]

[tasks."oats:prereq"]
alias = ["oats-prereq"]
description = "Prepare generated OBI/vendor dependencies and OATS test output"
depends = ["//oats:prereq"]

[tasks."oats:matrix:integration-test-json"]
alias = ["oats-integration-test-matrix-json"]
description = "Generate the OATS integration test matrix JSON"
depends = ["//oats:matrix:integration-test-json"]

[tasks."oats:test"]
alias = ["oats-test"]
description = "Run all OATS suites and merge integration coverage"
depends = ["//oats:test"]

[tasks."oats:test:ai"]
alias = ["oats-test-ai"]
description = "Run OATS ai tests"
depends = ["//oats:test:ai"]

[tasks."oats:test:amqp"]
alias = ["oats-test-amqp"]
description = "Run OATS amqp tests"
depends = ["//oats:test:amqp"]

[tasks."oats:test:debug"]
alias = ["oats-test-debug"]
description = "Run OATS Kafka tests in manual debug mode"
depends = ["//oats:test:debug"]

[tasks."oats:test:harness"]
alias = ["oats-test-harness"]
description = "Run OATS harness unit tests"
depends = ["//oats:test:harness"]

[tasks."oats:test:http"]
alias = ["oats-test-http"]
description = "Run OATS http tests"
depends = ["//oats:test:http"]

[tasks."oats:test:kafka"]
alias = ["oats-test-kafka"]
description = "Run OATS kafka tests"
depends = ["//oats:test:kafka"]

[tasks."oats:test:memcached"]
alias = ["oats-test-memcached"]
description = "Run OATS memcached tests"
depends = ["//oats:test:memcached"]

[tasks."oats:test:mongo"]
alias = ["oats-test-mongo"]
description = "Run OATS mongo tests"
depends = ["//oats:test:mongo"]

[tasks."oats:test:nats"]
alias = ["oats-test-nats"]
description = "Run OATS nats tests"
depends = ["//oats:test:nats"]

[tasks."oats:test:redis"]
alias = ["oats-test-redis"]
description = "Run OATS redis tests"
depends = ["//oats:test:redis"]

[tasks."oats:test:sql"]
alias = ["oats-test-sql"]
description = "Run OATS sql tests"
depends = ["//oats:test:sql"]

[tasks."vendor:obi"]
alias = ["vendor-obi"]
description = "Generate and vendor OBI dependencies using pinned native tools"
run = [
  { task = "generate" },
  { task = "generate:obi-tests" },
  { task = "vendor:copy-obi" },
]

[tasks."vendor:copy-obi"]
alias = ["copy-obi-vendor"]
description = "Vendor the pinned OBI module"
run = [
  { task = "vendor:obi-tests" },
  "go get go.opentelemetry.io/obi",
  "go mod tidy",
  "go mod vendor",
]

[tasks."check:licenses"]
alias = ["check-license", "check-licenses"]
description = "Check third-party license notices are current"
run = [
  { task = "license:update" },
  '''if ! git diff HEAD --quiet -- third_party_licenses.csv; then
    echo "### Diff for third_party_licenses.csv"
    git --no-pager diff -- third_party_licenses.csv
    echo "ERROR: third_party_licenses.csv is not up to date. Run 'mise run license:update' and include the changes." >&2
    exit 1
  fi''',
]

[tasks."integration:prepare"]
alias = ["prepare-integration-test"]
description = "Vendor OBI and clear resources left by prior integration tests"
depends = ["test:prepare-output", "vendor:obi"]
run = [
  '''rm -rf "${TEST_OUTPUT:-./testoutput}"/* || true''',
  { task = "clean:integration-test" },
]

[tasks."integration:test"]
alias = ["integration-test"]
description = "Prepare, run, and clean up OBI integration tests"
depends = ["integration:prepare"]
depends_post = ["clean:integration-test"]
run = [{ task = "integration:run" }, { task = "integration:coverage-data" }]

[tasks."integration:test:arm"]
alias = ["integration-test-arm"]
description = "Prepare, run, and clean up ARM integration tests"
depends = ["integration:prepare"]
depends_post = ["clean:integration-test"]
run = [{ task = "integration:run:arm" }, { task = "integration:coverage-data" }]

[tasks."integration:test:k8s"]
alias = ["integration-test-k8s"]
description = "Prepare, run, and clean up Kubernetes integration tests"
depends = ["integration:prepare"]
depends_post = ["clean:integration-test"]
run = [{ task = "integration:run:k8s" }, { task = "integration:coverage-data" }]
